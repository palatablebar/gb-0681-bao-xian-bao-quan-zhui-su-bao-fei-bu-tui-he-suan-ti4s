<section class="panel evidence"><header><h2>待辨认接收</h2><span>{{reception_queue|selectattr('disposition','equalto','待辨认')|list|length}} 次</span></header><div class="scroll"><table><thead><tr><th>接收</th><th>批次</th><th>来源</th><th>文件</th><th>接收时间 UTC</th><th>原文摘要</th><th>辨认</th></tr></thead><tbody>{% for r in reception_queue if r.disposition=='待辨认' %}<tr><td class="num">{{r.id}}</td><td>{{r.batch_id}}</td><td>{{r.source}}</td><td title="{{r.filename}}">{{r.filename}}</td><td class="num">{{r.received_at[:19]}}</td><td class="num" title="{{r.sha256}}">{{r.sha256[:12]}}</td><td><button class="identify" data-reception="{{r.id}}">归并同内容</button></td></tr>{% else %}<tr><td colspan="7">没有待辨认的接收</td></tr>{% endfor %}</tbody></table></div></section>
